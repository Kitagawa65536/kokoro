<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kokoro avatar</title>
  <style>
    html,
    body,
    #avatar-root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    canvas {
      display: block;
    }

    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      max-width: calc(100vw - 24px);
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(20, 20, 20, 0.72);
      color: #fff;
      font: 12px/1.4 system-ui, sans-serif;
      z-index: 5;
    }
  </style>
</head>

<body>
  <div id="avatar-root"></div>
  <div id="status">Loading...</div>
  <script type="module" src="./src/avatar.ts"></script>
</body>

</html>
