<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kokoro avatar</title>
  <style>
    html,
    body,
    #avatar-root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    canvas {
      display: block;
    }

    #status {
      position: fixed;
      left: 12px;
      bottom: 12px;
      max-width: calc(100vw - 24px);
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(20, 20, 20, 0.72);
      color: #fff;
      font: 12px/1.4 system-ui, sans-serif;
      z-index: 5;
    }

    .audio-action {
      position: fixed;
      right: 12px;
      z-index: 6;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 6px;
      background: rgba(20, 20, 20, 0.78);
      color: #fff;
      font: 12px/1.4 system-ui, sans-serif;
      cursor: pointer;
    }

    #audio-unlock {
      bottom: 12px;
    }

    #audio-replay {
      bottom: 52px;
      display: none;
    }

    body.audio-unlocked #audio-unlock {
      display: none;
    }

    body.audio-pending #audio-replay {
      display: block;
    }
  </style>
</head>

<body>
  <div id="avatar-root"></div>
  <div id="status">Loading...</div>
  <button id="audio-replay" class="audio-action" type="button">Play Last Speech</button>
  <button id="audio-unlock" class="audio-action" type="button">Enable Voice</button>
  <script type="module" src="./src/avatar.ts"></script>
</body>

</html>
